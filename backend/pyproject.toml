[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hoopsiq-backend"
version = "0.1.0"
description = "FastAPI backend foundation for HoopsIQ"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13",
  "anthropic>=0.40",
  "fastapi>=0.115",
  "nba_api>=1.6",
  "pydantic>=2.7",
  "psycopg[binary]>=3.2",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.30"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "mypy>=1.10",
  "pytest>=8.2",
  "ruff>=0.5"
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
packages = ["app"]
strict = true
warn_unreachable = true
