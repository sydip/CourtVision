services:
  db:
    image: postgres:16
    container_name: hoopsiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hoopsiq}
      POSTGRES_USER: ${POSTGRES_USER:-hoopsiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hoopsiq_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - hoopsiq_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hoopsiq} -d ${POSTGRES_DB:-hoopsiq}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  hoopsiq_postgres_data:

