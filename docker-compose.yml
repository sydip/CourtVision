services:
  db:
    image: postgres:16
    container_name: courtvision-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-courtvision}
      POSTGRES_USER: ${POSTGRES_USER:-courtvision}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-courtvision_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - courtvision_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-courtvision} -d ${POSTGRES_DB:-courtvision}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  courtvision_postgres_data:

